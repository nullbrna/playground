services:
    server:
        build: .
        ports:
            - 8080:8080
        environment:
            APP_ENV:      local
            LOG_LEVEL:    trace
            DATABASE_URI: postgres://admin:password@database:5432/playground
        depends_on:
            database:
                condition: service_healthy
        volumes:
            - ./go.mod:/app/go.mod
            - ./go.sum:/app/go.sum
            - ./main.go:/app/main.go
            - ./handler:/app/handler
            - ./docker/air.toml:/app/docker/air.toml

    database:
        image: postgres:16-alpine
        ports:
            - 5432:5432
        environment:
            POSTGRES_DB:       playground
            POSTGRES_USER:     admin
            POSTGRES_PASSWORD: password
        healthcheck:
            retries:  5
            timeout:  5s
            interval: 5s
            test:     ["CMD-SHELL", "pg_isready -U admin -d playground"]
        volumes:
            - ./docker/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro

    # OAuth provider that returns static user data mocking a real, successful
    # login flow. Enables an endpoint to hit instead of a browser/client.
    # ---
    # NOTE: See the OAuth mock configuration for the static data.
    mock-oauth:
        image: ghcr.io/navikt/mock-oauth2-server:6.1.1
        ports:
            - 7654:8080
        environment:
            JSON_CONFIG_PATH: /etc/oauth-mock-config.json
        volumes:
            - ./docker/oauth-mock-config.json:/etc/oauth-mock-config.json:ro
